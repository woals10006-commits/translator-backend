# API key is read from the CLAUDE_API_KEY environment variable — never commit the key.
claude.api.key=${CLAUDE_API_KEY:}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.port=8080

# Persist logs to a file (UTF-8) so translation failures can be diagnosed after
# the run — the console-only default lost the cause of past failures.
logging.file.name=logs/translator.log
logging.charset.file=UTF-8
logging.level.com.translator=INFO
